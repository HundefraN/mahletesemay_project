plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Always take version from pubspec.yaml. local.properties is often stale
// (still 1.0.3+5) and the Flutter plugin will bake that into the APK.
def pubspecFile = file("${rootProject.projectDir}/../pubspec.yaml")
def pubspecVersionName = '1.0.6'
def pubspecVersionCode = 8
if (pubspecFile.exists()) {
    def match = pubspecFile.getText('UTF-8') =~ /(?m)^version:\s*([^\s#+]+)(?:\+(\d+))?/
    if (match.find()) {
        pubspecVersionName = match.group(1).trim()
        if (match.group(2) != null) {
            pubspecVersionCode = match.group(2).toInteger()
        }
    }
}

def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    def localProperties = new Properties()
    localPropertiesFile.withInputStream { localProperties.load(it) }
    def currentName = localProperties.getProperty('flutter.versionName')
    def currentCode = localProperties.getProperty('flutter.versionCode')
    if (currentName != pubspecVersionName || currentCode != pubspecVersionCode.toString()) {
        localProperties.setProperty('flutter.versionName', pubspecVersionName)
        localProperties.setProperty('flutter.versionCode', pubspecVersionCode.toString())
        localPropertiesFile.withOutputStream { localProperties.store(it, null) }
    }
}

android {
    namespace "com.hundefra.mahlete_semay"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.hundefra.mahlete_semay"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 34
        versionCode pubspecVersionCode
        versionName pubspecVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
