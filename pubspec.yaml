name: mahlete_semay_project
description: "Mahlete Semay Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  google_fonts: ^6.2.1
  animations: ^2.0.11
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  image_cropper: ^9.1.0
  material_design_icons_flutter: ^7.0.7296
  permission_handler: ^12.0.1
  cached_network_image: ^3.3.1
  dots_indicator: ^4.0.1
  record: ^6.1.1
  collection: ^1.18.0
  share_plus: ^11.1.0
  path_provider: ^2.1.3
  flutter_colorpicker: ^1.1.0
  audioplayers: ^6.0.0
  file_picker: ^10.3.1
  dropdown_search: ^6.0.2
  confetti: ^0.8.0
  youtube_player_flutter: ^9.0.1
  http: ^1.2.1
  iconsax_plus: ^1.0.0
  flutter_staggered_animations: ^1.1.1
  connectivity_plus: ^6.1.5
  flutter_local_notifications: ^19.4.0
  # Used directly for timezone-aware notification scheduling.
  timezone: ^0.10.1
  intl: ^0.20.2
  timeago: ^3.6.1
  url_launcher: ^6.3.0
  flutter_native_splash: ^2.4.0
  tutorial_coach_mark: ^1.2.12
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^0.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_animate: ^4.5.2
  fl_chart: ^1.0.0
  device_info_plus: ^11.5.0
  nanoid: ^1.0.0
  flutter_slidable: ^4.0.1
  reorderable_list: ^0.0.1
  dio: ^5.4.0
  flutter_dotenv: ^6.0.0
  pitch_detector_dart: ^0.0.7
  flutter_timezone: ^3.0.1
  package_info_plus: ^8.0.0
  pub_semver: ^2.1.4
  open_file_plus: ^3.4.1
  workmanager: ^0.5.2
  android_alarm_manager_plus: ^4.0.7

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#0A1E3F"
  color_dark: "#0A1E3F"
  image: assets/logo/logo.png
  android_12:
    image: assets/logo/logo.png
    color: "#0A1E3F"
    color_dark: "#0A1E3F"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  adaptive_icon_background: "#0A1E3F"
  adaptive_icon_foreground: "assets/logo/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/logo/logo.png
    - assets/images/
    - assets/audio/